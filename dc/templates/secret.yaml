{{- if .Values.imagePullSecret.create -}}
# ImagePullSecret for pulling the nr-bqs-knox image from GitHub Container
# Registry. Rather than storing a raw token in values, pass a pre-built,
# base64-encoded .dockerconfigjson via:
#
#   --set imagePullSecret.dockerConfigJSON="$(cat .dockerconfigjson | base64 -w0)"
#
# If the pull secret already exists in the cluster, set
#   --set imagePullSecret.create=false
# and reference it via image.imagePullSecretName instead.
apiVersion: v1
kind: Secret
type: kubernetes.io/dockerconfigjson
metadata:
  name: {{ .Values.imagePullSecret.name | default (.Chart.Name) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nr-bqs-knox.labels" . | nindent 4 }}
data:
  .dockerconfigjson: {{ required "imagePullSecret.dockerConfigJSON (base64-encoded .dockerconfigjson) must be provided" .Values.imagePullSecret.dockerConfigJSON | b64enc | quote }}
{{- end -}}
