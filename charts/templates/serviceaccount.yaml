apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nr-bqs-knox.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nr-bqs-knox.labels" . | nindent 4 }}
  {{- if .Values.imagePullSecret.create }}
imagePullSecrets:
    - name: {{ .Values.imagePullSecret.name | default .Chart.Name }}
  {{- end }}
